name: Deploy digital exhibition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download verified website package
        run: curl -L --fail --retry 5 -o site-package.png "https://cdnmf.picsart.com/cloud-storage/f51cb574-593c-4c26-92f8-4339fb2230b5.png"

      - name: Extract website files
        shell: python
        run: |
          import io
          import struct
          import zipfile
          import zlib
          from pathlib import Path

          png = Path("site-package.png").read_bytes()
          position = 8
          compressed = b""
          width = height = None

          while position < len(png):
              length = struct.unpack(">I", png[position:position + 4])[0]
              kind = png[position + 4:position + 8]
              data = png[position + 8:position + 8 + length]
              position += 12 + length
              if kind == b"IHDR":
                  width, height, depth, color, _, _, _ = struct.unpack(">IIBBBBB", data)
                  if depth != 8 or color != 2:
                      raise ValueError("Unexpected package image format")
              elif kind == b"IDAT":
                  compressed += data
              elif kind == b"IEND":
                  break

          decoded = zlib.decompress(compressed)
          stride = width * 3
          rows = []
          previous = bytearray(stride)
          offset = 0

          for _ in range(height):
              filter_type = decoded[offset]
              offset += 1
              current = bytearray(decoded[offset:offset + stride])
              offset += stride
              for index in range(stride):
                  left = current[index - 3] if index >= 3 else 0
                  above = previous[index]
                  upper_left = previous[index - 3] if index >= 3 else 0
                  if filter_type == 1:
                      current[index] = (current[index] + left) & 255
                  elif filter_type == 2:
                      current[index] = (current[index] + above) & 255
                  elif filter_type == 3:
                      current[index] = (current[index] + ((left + above) // 2)) & 255
                  elif filter_type == 4:
                      estimate = left + above - upper_left
                      distances = (abs(estimate - left), abs(estimate - above), abs(estimate - upper_left))
                      predictor = (left, above, upper_left)[distances.index(min(distances))]
                      current[index] = (current[index] + predictor) & 255
                  elif filter_type != 0:
                      raise ValueError(f"Unsupported PNG filter: {filter_type}")
              rows.append(bytes(current))
              previous = current

          payload = b"".join(rows)
          zip_length = struct.unpack(">I", payload[:4])[0]
          output = Path("site")
          output.mkdir()
          with zipfile.ZipFile(io.BytesIO(payload[4:4 + zip_length])) as archive:
              archive.extractall(output)
          (output / ".nojekyll").touch()

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
